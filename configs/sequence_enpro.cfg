set r_ptPreset custom
set r_ptDraw 0
set r_ptRenderScale 1
set r_ptSamplesPerPixel 4
set r_ptMaxDepth 2
set r_ptMaxLightSamples 4
set r_ptDenoise 1
set r_ptDenoiseStrength 0.5
set r_ptDenoiseDebug 0
set r_ptPhysicalExposureCompensation 2
set r_ptPhysicalDOF 0
set r_ptPhysicalFogDensity 0.05
set r_ptPhysicalFogAlbedo 0.9
set r_ptPhysicalFogAnisotropy 0.3
set r_ptPhysicalFogRadius 30
set r_ptPhysicalFogSteps 4
set r_ptBloom 0
set r_ptLensFlare 0
set r_screenshotFormat 2
set r_swapInterval 0
set com_fixedTic 0
set r_ptCaptureReport 1
set r_ptCaptureTelemetry 1
map game/enpro
r_ptSequence 300 400 8
wait 10000
quit
